[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataFishing"
version = "1.6.1"
description = "An Efficient Python Tool for Mining Mitochondrial and Chloroplast Sequences, Taxonomic, and Biodiversity Data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Luan Rabelo", email = "luanrabelo@outlook.com"}
]
maintainers = [
    {name = "Luan Rabelo", email = "luanrabelo@outlook.com"}
]
keywords = ["biodiversity", "taxonomy", "sequences", "mitochondrial", "chloroplast", "BOLD", "WoRMS", "GBIF", "IUCN", "NCBI"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.8"
dependencies = [
    "aiofiles>=23.0.0",
    "aiohttp>=3.8.0",
    "pandas>=1.5.0",
    "requests>=2.28.0",
    "xlsxwriter>=3.0.0",
    "biopython>=1.80",
    "SynGenes>=1.0.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/luanrabelo/dashFishing"
Documentation = "https://github.com/luanrabelo/dashFishing"
Repository = "https://github.com/luanrabelo/dashFishing"
Issues = "https://github.com/luanrabelo/dashFishing/issues"

[project.scripts]
dataFishing = "dataFishing.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dataFishing*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
